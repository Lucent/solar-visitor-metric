			<path fill="#28764b" d="M-1.1 75.8C13 62.6 17.2 47.1 28.9 33.4C40.7 19.7 52.8 15.5 65.1 23.1C73.4 28.2 79.4 37.1 79.4 45.4C79.4 37.1 76.6 26.2 66.9 20.2C53.2 11.8 39.3 17.6 27.1 31.8C14.8 46.1 13 62.6 -1.1 75.8ZM19.4 14.1C29 10.6 38 18.4 46.1 19.7L47.2 18C39 16.7 29 10.6 19.4 14.1ZM7.3 32.1C15 24.6 26 29.1 33.4 27.4L34.2 25.8C25 27.4 15 24.6 7.3 32.1ZM4.5 54C9 45.6 16 45.6 22.1 41.1L22.5 39.6C15 44.1 9 45.6 4.5 54Z" style="--stand: path('M-39.2 52C-22 49 -5.4 44 11.6 40.5C25.6 37.7 38.7 36.1 52.9 38.3C61.9 39.6 71.1 41.6 79.4 45.4C70.8 41.4 62.9 36.4 53.4 34.9C39.1 32.8 25.2 35.3 11.2 38.1C-5.9 41.7 -22 48.9 -39.2 52ZM14.2 19.4C22.7 22.4 25.4 32.5 33.3 36.4L34.7 35C26.7 31.4 22.7 22.3 14.2 19.4ZM-3 25.1C6.5 25.5 10.6 35 18.7 38.2L20.2 37.2C12 33.8 6.4 25.5 -3 25.1ZM-20.2 38.5C-12.1 36.2 -6.2 40.8 1.5 41.8L2.8 41C-5.2 39.3 -11.9 36.1 -20.2 38.5Z')"/>
