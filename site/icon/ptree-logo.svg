<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 0 121.1 121.1" role="img" aria-labelledby="title">
	<title id="title">Ptree</title>
	<view id="logo" viewBox="-3 0 288 121.1"/>
	<view id="inverse" viewBox="-3 0 288 121.1"/>
	<view id="fold" viewBox="-36 -114 321 235.1"/>
	<style>
		#inverse:target ~ #wordmark { fill: #b58254; stroke: none; }
		/* The leaf stands and droops into the P. Each shape and stop carries its standing value in --stand; its own value is the P. The stem bends; the blade rides the stem's tip, turning as a whole about the junction a moment behind it, heavier and looser, while unbending only what the turn can't carry. */
		#fold:target ~ path, #fold:target ~ #blade, #fold:target ~ defs stop[style] { animation: 1s .5s cubic-bezier(.6, 0, .3, 1.04) backwards; }
		#fold:target ~ #blade > g, #fold:target ~ #blade path { animation: .95s .55s cubic-bezier(.6, 0, .25, 1.12) backwards; }
		#fold:target ~ path, #fold:target ~ #blade path { animation-name: stand; }
		#fold:target ~ #blade { animation-name: carry; }
		#fold:target ~ #blade > g { animation-name: swing; transform-origin: 79.4px 45.4px; }
		#fold:target ~ defs stop[style] { animation-name: shade; }
		@keyframes stand { from { d: var(--stand); } }
		@keyframes carry { from { translate: -49.5px -37.3px; } }
		@keyframes swing { from { rotate: 81.3deg; } }
		@keyframes shade { from { stop-color: var(--stand); } }
	</style>
	<defs>
		<linearGradient id="leaf" x1="31.5" y1="6.5" x2="25.9" y2="75.8" gradientUnits="userSpaceOnUse">
			<stop stop-color="#a1c76c"/>
			<stop offset=".48" stop-color="#589957"/>
			<stop offset="1" stop-color="#176b51"/>
		</linearGradient>
		<linearGradient id="leaf-fold" x1="54" y1="18.6" x2="20" y2="75.8" gradientUnits="userSpaceOnUse">
			<stop stop-color="#8bb667"/>
			<stop offset=".5" stop-color="#438957"/>
			<stop offset="1" stop-color="#176b51"/>
		</linearGradient>
		<linearGradient id="under" x1="23" y1="85.6" x2="17" y2="117.6" gradientUnits="userSpaceOnUse">
			<stop stop-color="#124f40" style="--stand: #2f7a55"/>
			<stop offset=".4" stop-color="#287955" style="--stand: #488d5c"/>
			<stop offset="1" stop-color="#79ac62" style="--stand: #79ac62"/>
		</linearGradient>
		<linearGradient id="inner" x1="59.4" y1="26.4" x2="31.5" y2="117.6" gradientUnits="userSpaceOnUse">
			<stop stop-color="#104f3d" style="--stand: #1b5e46"/>
			<stop offset=".2" stop-color="#216e4f" style="--stand: #2a7452"/>
			<stop offset=".5" stop-color="#86b465" style="--stand: #76ab62"/>
			<stop offset=".68" stop-color="#377e56" style="--stand: #3b8258"/>
			<stop offset="1" stop-color="#185d49" style="--stand: #1e634b"/>
		</linearGradient>
		<linearGradient id="top" x1="7.3" y1="112.9" x2="62.2" y2="24.5" gradientUnits="userSpaceOnUse">
			<stop stop-color="#76ac60"/>
			<stop offset=".3" stop-color="#92bd68"/>
			<stop offset=".55" stop-color="#a1c972"/>
			<stop offset=".8" stop-color="#84b360"/>
			<stop offset="1" stop-color="#b4d77d"/>
		</linearGradient>
		<linearGradient id="stem" x1="54" y1="18.6" x2="20" y2="75.8" gradientUnits="userSpaceOnUse">
			<stop stop-color="#9dbf74"/>
			<stop offset=".5" stop-color="#70a365"/>
			<stop offset="1" stop-color="#43875a"/>
		</linearGradient>
	</defs>
	<!-- The stem is one thin band folded along its lit edge, which runs on under the blade as the midrib: the right-facing face (under) shows at the foot and tucks behind the edge at the join, the left-facing face (inner) widens up the bowl, and the highlight (top) is the edge itself. Faces share their edges exactly. -->
