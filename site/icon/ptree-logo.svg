	<path fill="url(#top)" d="M2.7 117.6C4.9 110.5 9.6 102.6 13.8 96.5C21.3 85.5 31.9 82.3 44.1 79C60.1 74.6 80.3 64.9 79.4 45.3C78.3 25.4 55.8 13.4 39.4 24C55.8 13.4 78.3 25.4 79.4 45.2C80.3 64.1 58 72.9 43.6 76.9C30.9 80.3 19.9 84 12.3 95.4C8 101.8 3.8 110 2.7 117.6Z" style="--stand: path('M2.7 117.6C4.6 109.9 6.5 102.1 8.5 94.4C11.4 82.7 14.3 71.1 17.1 59.5C21.4 42.3 25.7 25.1 30 8C34.4 -9.8 34.1 -28.6 29 -46.2C34 -28.9 35 -9.5 29.2 7.8C23.6 24.6 19.7 41.8 15.4 59C12.5 70.7 9.6 82.3 6.7 93.9C4.7 101.9 3.3 109.5 2.7 117.6Z')"/>
	<!-- The blade rides the stem's tip and turns as a whole about the junction. -->
